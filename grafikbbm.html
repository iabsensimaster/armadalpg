<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form i-Ledger</title>
  <link rel="icon" href="pertamina-logoicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to bottom right, #ffffff, #e0e7ff);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .card {
      animation: fadeIn 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Spinner overlay */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }
    #loadingOverlay.active {
      opacity: 1;
      visibility: visible;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Tombol */
    .btn {
      display: inline-block;
      text-align: center;
      border-radius: 0.75rem;
      padding: 0.6rem 1rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }
    .btn-primary {
      background-color: #2563eb;
      color: white;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background-color: #1e40af;
      transform: scale(1.03);
    }
    .btn-green {
      background-color: #22c55e;
      color: white;
      box-shadow: 0 2px 6px rgba(34, 197, 94, 0.3);
    }
    .btn-green:hover {
      background-color: #16a34a;
      transform: scale(1.03);
    }

    /* Input */
    input, select {
      outline: none;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      width: 100%;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Modal animasi */
    .fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>

<body>
  <!-- Spinner -->
  <div id="loadingOverlay">
    <div class="spinner mb-3"></div>
    <div id="loadingPercent" class="text-blue-600 font-semibold text-lg">0%</div>
    <p class="text-gray-500 text-sm mt-1">Mengirim data...</p>
  </div>

  <!-- Dashboard Button -->
  <a href="dashboard.html" class="absolute top-4 right-4 bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-2 rounded-lg shadow-md transition">
    Dashboard
  </a>

  <!-- Card -->
  <div class="card bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 text-sm">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-5">
      <img src="pertamina-logoicon.png" alt="Logo i-Ledger" class="w-24 mb-3">
      <h2 id="pt-nama" class="text-xl font-bold text-blue-700 text-center">PT ANDA</h2>
      <p class="text-gray-500 text-sm">Form Transaksi i-Ledger</p>
    </div>

    <form id="ledgerForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Nama</label>
        <select id="nama" required></select>
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Uraian</label>
        <input list="uraianList" id="uraian" required />
        <datalist id="uraianList"></datalist>
      </div>

      <div id="nopolContainer" class="hidden">
        <label class="block text-gray-700 font-medium mb-1">Nomor Polisi (Nopol)</label>
        <input type="text" id="nopol" placeholder="Contoh: D 1234 AB" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Pos</label>
        <input type="text" id="pos" readonly class="bg-gray-100" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Nominal</label>
        <input type="text" id="nominal" required />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Foto Nota</label>
        <div class="flex gap-2 mb-1">
          <label for="fotoNotaUpload" class="btn btn-primary cursor-pointer text-sm w-full">Galeri</label>
          <label for="fotoNotaCamera" class="btn btn-primary cursor-pointer text-sm w-full">Kamera</label>
        </div>
        <input type="file" accept="image/*" id="fotoNotaUpload" class="hidden" />
        <input type="file" accept="image/*" capture="environment" id="fotoNotaCamera" class="hidden" />
        <img id="previewNota" class="w-full max-h-56 object-cover rounded-lg border mt-2 hidden" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Pembayaran</label>
        <select id="pembayaran">
          <option value="Cash">Cash</option>
          <option value="Transfer">Transfer</option>
        </select>
      </div>

      <div id="buktiTransferContainer" class="hidden">
        <label class="block text-gray-700 font-medium mb-1">Bukti Transfer</label>
        <label for="buktiTransfer" class="btn btn-primary text-sm cursor-pointer inline-block w-full">Upload Bukti</label>
        <input type="file" accept="image/*" id="buktiTransfer" class="hidden" />
        <img id="previewBukti" class="w-full max-h-56 object-cover rounded-lg border mt-2 hidden" />
      </div>

      <button type="submit" class="btn btn-green w-full text-center">Kirim Transaksi</button>
    </form>
  </div>

  <!-- Modal Success -->
  <div id="modalSuccess" class="fixed inset-0 z-50 bg-black bg-opacity-40 hidden flex items-center justify-center">
    <div class="bg-white rounded-xl p-6 shadow-lg text-center w-72 fade-in">
      <h3 class="text-lg font-bold text-green-600 mb-2">✅ Transaksi Berhasil!</h3>
      <p class="text-gray-600 mb-4">Data telah disimpan ke sistem.</p>
      <button id="modalClose" class="btn btn-primary text-sm w-full">Tutup</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const overlay = document.getElementById('loadingOverlay');
    const percent = document.getElementById('loadingPercent');
    const showLoading = () => {
      overlay.classList.add('active');
      let p = 0;
      const i = setInterval(() => {
        p += 10;
        percent.textContent = p + '%';
        if (p >= 100) clearInterval(i);
      }, 60);
    };
    const hideLoading = () => overlay.classList.remove('active');

    if (localStorage.getItem('loggedIn') !== 'true') {
      window.location.href = 'login.html';
    }

    document.getElementById("pt-nama").textContent = localStorage.getItem("nama_pt") + " (i-Ledger)";
    const id_spreadsheet = localStorage.getItem("id_spreadsheet");
    const API_NAMA = getAPIUrl('nama');
    const API_POS = getAPIUrl('pos');
    const SUBMIT_URL = API_ENDPOINT + '?id_spreadsheet=' + id_spreadsheet;

    const namaEl = document.getElementById('nama');
    const uraianEl = document.getElementById('uraian');
    const posEl = document.getElementById('pos');
    const nominalEl = document.getElementById('nominal');
    const fotoUpload = document.getElementById('fotoNotaUpload');
    const fotoCamera = document.getElementById('fotoNotaCamera');
    const buktiInput = document.getElementById('buktiTransfer');
    const pembayaran = document.getElementById('pembayaran');
    const buktiContainer = document.getElementById('buktiTransferContainer');
    const previewNota = document.getElementById('previewNota');
    const previewBukti = document.getElementById('previewBukti');
    const spinner = document.getElementById('spinner');
    const modal = document.getElementById('modalSuccess');
    const modalClose = document.getElementById('modalClose');
    const nopolContainer = document.getElementById('nopolContainer');
    const nopolInput = document.getElementById('nopol');

    const perawatanList = ["GANTI OLI", "SERVICE", "GANTI BAN", "GANTI KOPLING", "STNK", "PAJAK KENDARAAN", "KIR", "PERTAMAX", "PERTALITE", "DEXLITE", "PERTAMINA DEX", "SOLAR"];

    modalClose.onclick = () => modal.classList.add('hidden');

    const showSpinner = () => spinner.classList.remove('hidden');
    const hideSpinner = () => spinner.classList.add('hidden');
    const showModal = () => modal.classList.remove('hidden');

    // Ambil data Nama
    fetch(API_NAMA).then(r => r.json()).then(data => {
      data.forEach(n => {
        const o = document.createElement('option');
        o.value = o.textContent = n;
        namaEl.appendChild(o);
      });
    });

    // Ambil data POS
    let uraianMap = {};
    fetch(API_POS).then(r => r.json()).then(data => {
      data.forEach(row => {
        uraianMap[row.uraian] = row.pos;
        const o = document.createElement('option');
        o.value = row.uraian;
        document.getElementById('uraianList').appendChild(o);
      });
    });

    uraianEl.addEventListener('input', () => {
      posEl.value = uraianMap[uraianEl.value] || '';
      // Munculkan kolom Nopol kalau uraian termasuk kategori perawatan
      if (perawatanList.includes(uraianEl.value.trim())) {
        nopolContainer.classList.remove('hidden');
      } else {
        nopolContainer.classList.add('hidden');
        nopolInput.value = '';
      }
    });

    pembayaran.addEventListener('change', () => {
      buktiContainer.classList.toggle('hidden', pembayaran.value !== 'Transfer');
    });

    fotoUpload.addEventListener('change', () => {
      previewNota.src = URL.createObjectURL(fotoUpload.files[0]);
      previewNota.classList.remove('hidden');
    });

    fotoCamera.addEventListener('change', () => {
      previewNota.src = URL.createObjectURL(fotoCamera.files[0]);
      previewNota.classList.remove('hidden');
    });

    buktiInput.addEventListener('change', () => {
      previewBukti.src = URL.createObjectURL(buktiInput.files[0]);
      previewBukti.classList.remove('hidden');
    });

    nominalEl.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = new Intl.NumberFormat('id-ID').format(v);
    });

    // Submit Form
    document.getElementById('ledgerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const nama = namaEl.value;
      const uraian = uraianEl.value;
      const pos = posEl.value;
      const nopol = nopolInput.value.trim();
      const nominal = nominalEl.value.replace(/\D/g, '');
      const pembayaranVal = pembayaran.value;

      if (perawatanList.includes(uraian) && !nopol) {
        return alert("❌ Nopol wajib diisi untuk perawatan kendaraan.");
      }

      const fotoFile = fotoUpload.files[0] || fotoCamera.files[0];
      if (!fotoFile) return alert("❌ Foto nota wajib diunggah.");

      const buktiFile = pembayaranVal === "Transfer" ? buktiInput.files[0] : null;
      if (pembayaranVal === "Transfer" && !buktiFile) return alert("❌ Bukti transfer wajib diunggah.");

      const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      try {
        showSpinner();
        const fotoNotaBase64 = await toBase64(fotoFile);
        const fotoBuktiBase64 = buktiFile ? await toBase64(buktiFile) : "";

        const payload = {
          action: 'addTransaksi',
          sheet: 'Transaksi',
          payload: {
            nama, uraian, pos, nominal, pembayaran: pembayaranVal,
            fotoNota: fotoNotaBase64,
            fotoBukti: fotoBuktiBase64,
            nopol: nopol || ""
          }
        };

        const res = await fetch(SUBMIT_URL + '&action=addTransaksi', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        hideSpinner();

        if (result.status === 'success') {
          document.getElementById('ledgerForm').reset();
          previewNota.classList.add('hidden');
          previewBukti.classList.add('hidden');
          posEl.value = '';
          nopolContainer.classList.add('hidden');
          buktiContainer.classList.add('hidden');
          showModal();
        } else {
          alert('❌ Gagal: ' + result.message);
        }
      } catch (err) {
        hideSpinner();
        alert('❌ Error koneksi: ' + err.message);
      }
    });

    // Auto logout setelah 5 menit
    setTimeout(() => {
      localStorage.clear();
      window.location.href = "login.html";
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
